name: Validate gallery manifest

# Automated curation gate: a community submission can't land unless manifest.json
# still loads and renders in the app. Mirrors VoiceStudio's runtime validation.
on:
  pull_request:
    paths:
      - "manifest.json"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-manifest.yml"
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
  # Release assets can vanish or change without touching the manifest; the
  # weekly run is what notices before a user does.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install --upgrade jsonschema pytest pyyaml
      - name: Validate manifest.json
        run: python scripts/validate_manifest.py
      # The submission-triage logic is pure text-in/verdict-out precisely so it
      # can be tested here rather than only in production on a contributor's
      # issue.
      - name: Run script tests
        run: python -m pytest tests/ -q
      # An issue form that does not parse silently reverts to a blank issue
      # body, which is how a malformed submission gets in without anyone
      # noticing the template broke.
      - name: Issue forms and workflows parse
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob(".github/ISSUE_TEMPLATE/*.yml")
                             + glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{path}: {e}")
          if bad:
              sys.exit("unparseable YAML:\n" + "\n".join(bad))
          print("all issue forms and workflows parse")
          PY

  verify-audio:
    # Downloads every recorded voice the way the app does and checks sha256,
    # WAV container and length — the things the manifest alone cannot prove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify recorded-voice audio
        run: python scripts/verify_voice_audio.py
