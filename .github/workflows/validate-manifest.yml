name: Validate gallery manifest

# Automated curation gate: a community submission can't land unless manifest.json
# still loads and renders in the app. Mirrors OmniVoice's runtime validation.
on:
  pull_request:
    paths:
      - "manifest.json"
      - "schema/**"
      - "scripts/validate_manifest.py"
      - ".github/workflows/validate-manifest.yml"
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "schema/**"
      - "scripts/validate_manifest.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install --upgrade jsonschema
      - name: Validate manifest.json
        run: python scripts/validate_manifest.py
